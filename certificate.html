<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HackProof Certificate</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

<style>
body {
  background: #0f172a;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

/* CERTIFICATE */
.certificate {
  width: 1000px;
  max-width: 95%;
  background: white;
  padding: 70px;
  border: 15px solid #1e293b;
  position: relative;
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
}

/* WATERMARK LOGO */
.certificate::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 420px;
  height: 420px;
  background: url('favicon.svg') no-repeat center;
  background-size: contain;
  opacity: 0.05;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

/* INNER BORDER */
.inner-border {
  border: 2px solid #22c55e;
  padding: 40px;
}

/* TITLE */
.title {
  text-align: center;
  font-family: 'Playfair Display', serif;
  font-size: 42px;
}

/* SUBTITLE */
.subtitle {
  text-align: center;
  margin-bottom: 30px;
  color: #475569;
}

/* LOGO TOP */
.logo {
  text-align: center;
  margin-bottom: 10px;
}

/* NAME */
.name {
  text-align: center;
  font-size: 36px;
  color: #22c55e;
  margin: 25px 0;
  font-weight: 600;
}

/* CONTENT */
.content {
  text-align: center;
  font-size: 18px;
}

/* FOOTER */
.footer {
  margin-top: 60px;
  display: flex;
  justify-content: space-between;
}

/* SIGNATURE */
.signature {
  text-align: center;
}

.signature-line {
  border-top: 1px solid black;
  width: 200px;
  margin-top: 40px;
}

/* CERT ID */
.cert-id {
  text-align: center;
  margin-top: 20px;
  color: #555;
}

/* PRINT BUTTON */
.print-btn {
  position: absolute;
  top: -50px;
  right: 0;
  padding: 10px 15px;
  background: #22c55e;
  border: none;
  cursor: pointer;
  border-radius: 6px;
}

/* PRINT */
@media print {
  body { background: white; }
  .print-btn { display: none; }
}
</style>
</head>

<body>

<div class="certificate">
<button class="print-btn" onclick="window.print()">Download / Print</button>

<div class="inner-border">

<div class="logo">
  <img src="favicon.svg" width="70">
</div>

<div class="title">Certificate of Completion</div>
<div class="subtitle">HackProof Cybersecurity Training Program</div>

<div class="content">This certificate is proudly presented to</div>

<div class="name" id="studentName">Student Name</div>

<div class="content">
For successfully completing the <b id="courseName">Cybersecurity Training</b>
and demonstrating practical cybersecurity and ethical hacking skills.
</div>

<div class="cert-id">
Certificate ID: <span id="certID"></span><br>
Date: <span id="date"></span>
</div>

<div class="footer">
  <div class="signature">
    <div class="signature-line"></div>
    Instructor
  </div>

  <div class="signature">
    <div class="signature-line"></div>
    HackProof
  </div>
</div>

</div>
</div>

<script>
// Get URL parameters
const params = new URLSearchParams(window.location.search);
const name = params.get("name") || "HackProof Learner";
const course = params.get("course") || "Cybersecurity Training";

// Set values
document.getElementById("studentName").innerText = name;
document.getElementById("courseName").innerText = course;

// Generate certificate ID
const certID = "HP-" + Math.floor(100000 + Math.random() * 900000);
document.getElementById("certID").innerText = certID;

// Current date
const today = new Date();
document.getElementById("date").innerText = today.toDateString();
</script>

</body>
</html>

<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings | HackProof</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#020617;
  --card:#0f172a;
  --border:#1e293b;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --green:#22c55e;
  --blue:#38bdf8;
  --purple:#a855f7;
  --red:#ef4444;
}

body{
  margin:0;
  font-family:Inter;
  background: radial-gradient(circle at top, #020617, #000);
  color:var(--text);
}

/* NAV */
.topnav{
  display:flex;
  justify-content:space-between;
  padding:15px 40px;
  border-bottom:1px solid var(--border);
}

.logo{ color:var(--green); font-weight:700; }

.container{
  max-width:900px;
  margin:auto;
  padding:40px 20px;
}

/* CARD */
.settings-card{
  background:linear-gradient(145deg,#0f172a,#020617);
  padding:25px;
  border-radius:16px;
  border:1px solid var(--border);
  margin-bottom:25px;
}

.settings-card h3{ margin-bottom:15px; }

/* INPUTS */
input, select{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:1px solid var(--border);
  background:#020617;
  color:white;
}

/* BUTTONS */
button{
  padding:10px 20px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin-top:10px;
  font-weight:600;
}

.save-btn{ background:var(--green); }
.red-btn{ background:var(--red); width:100%; }

/* PROFILE IMAGE */
.profile-img{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid var(--green);
}

/* LIST */
ul{ padding-left:20px; }
</style>

</head>

<body>

<div class="topnav">
  <div class="logo">HackProof</div>
</div>

<div class="container">

<!-- PROFILE -->

<div class="settings-card">
  <h3>Profile Settings</h3>

  <div style="text-align:center;">
    <img id="profileImage" class="profile-img">
    <br><br>
    <input type="file" id="imageUpload">
    <button onclick="uploadImage()">Upload Image</button>
  </div>

  <input type="text" id="usernameInput" placeholder="Username">
  <input type="text" id="bioInput" placeholder="Bio">
  <input type="text" id="githubInput" placeholder="GitHub">

  <p id="createdDate"></p>

<button class="save-btn" onclick="updateProfile()">Save Profile</button>

</div>

<!-- ACCOUNT -->

<div class="settings-card">
  <h3>Account Security</h3>
  <input type="email" id="emailInput" placeholder="New Email">
  <input type="password" id="passwordInput" placeholder="New Password">
  <button class="save-btn" onclick="updateAccount()">Update Account</button>
</div>

<!-- NOTIFICATIONS -->

<div class="settings-card">
  <h3>Notifications</h3>
  <label><input type="checkbox" id="emailNotif"> Email Notifications</label><br>
  <label><input type="checkbox" id="courseNotif"> Course Updates</label><br>
  <label><input type="checkbox" id="ctfNotif"> CTF Alerts</label><br>
  <button class="save-btn" onclick="saveNotifications()">Save</button>
</div>

<!-- LEARNING -->

<div class="settings-card">
  <h3>Learning Preferences</h3>
  <select id="learningPath">
    <option>Red Team</option>
    <option>Blue Team</option>
    <option>Web Security</option>
  </select>
  <input type="number" id="dailyGoal" placeholder="Daily Goal (minutes)">
  <button class="save-btn" onclick="saveLearning()">Save</button>
</div>

<!-- SECURITY LOGS -->

<div class="settings-card">
  <h3>Security Logs</h3>
  <ul id="logs"></ul>
</div>

<!-- DANGER -->

<div class="settings-card" style="border:1px solid var(--red);">
  <h3 style="color:var(--red);">Danger Zone</h3>
  <button class="red-btn" onclick="deleteAccount()">
    ⚠️ Delete Account Permanently
  </button>
</div>

</div>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<script src="firebase-config.js"></script>

<script>

/* LOAD USER */
auth.onAuthStateChanged(async user=>{
  if(!user){
    window.location.href="login.html";
    return;
  }

  const doc = await db.collection("users").doc(user.uid).get();
  const data = doc.data();

  usernameInput.value = data.username || "";
  bioInput.value = data.bio || "";
  githubInput.value = data.github || "";

  if(data.photoURL){
    profileImage.src = data.photoURL;
  }

  createdDate.innerText =
    "Account Created: " + new Date(user.metadata.creationTime).toDateString();

  logSecurity(user.uid, "Login");
  loadLogs(user.uid);
});

/* IMAGE UPLOAD */
function uploadImage(){
  const file = imageUpload.files[0];
  const user = auth.currentUser;

  if(!file) return alert("Select image");

  const ref = firebase.storage().ref("profiles/"+user.uid);

  ref.put(file).then(async ()=>{
    const url = await ref.getDownloadURL();

    await db.collection("users").doc(user.uid).update({
      photoURL: url
    });

    profileImage.src = url;
    alert("Image updated");
  });
}

/* PROFILE */
function updateProfile(){
  const user = auth.currentUser;

  db.collection("users").doc(user.uid).update({
    username: usernameInput.value,
    bio: bioInput.value,
    github: githubInput.value
  });

  alert("Profile updated");
}

/* ACCOUNT */
function updateAccount(){
  const user = auth.currentUser;

  if(emailInput.value) user.updateEmail(emailInput.value);
  if(passwordInput.value) user.updatePassword(passwordInput.value);

  alert("Account updated");
}

/* NOTIFICATIONS */
function saveNotifications(){
  const user = auth.currentUser;

  db.collection("users").doc(user.uid).update({
    notifications:{
      email: emailNotif.checked,
      course: courseNotif.checked,
      ctf: ctfNotif.checked
    }
  });

  alert("Saved");
}

/* LEARNING */
function saveLearning(){
  const user = auth.currentUser;

  db.collection("users").doc(user.uid).update({
    learningPath: learningPath.value,
    dailyGoal: dailyGoal.value
  });

  alert("Saved");
}

/* SECURITY LOG */
function logSecurity(uid, action){
  db.collection("securityLogs").doc(uid)
    .collection("logs")
    .add({
      action: action,
      time: new Date().toISOString()
    });
}

async function loadLogs(uid){
  const snap = await db.collection("securityLogs")
    .doc(uid).collection("logs")
    .orderBy("time","desc").limit(5).get();

  logs.innerHTML="";
  snap.forEach(doc=>{
    const d = doc.data();
    logs.innerHTML += `<li>${d.action} - ${d.time}</li>`;
  });
}

/* DELETE */
function deleteAccount(){
  if(!confirm("Delete account permanently?")) return;

  const input = prompt("Type DELETE to confirm");

  if(input !== "DELETE"){
    alert("Cancelled");
    return;
  }

  auth.currentUser.delete().then(()=>{
    alert("Deleted");
    window.location.href="index.html";
  });
}

</script>

</body>
</html>

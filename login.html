<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | HackProof</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  height:100vh;
  display:flex;
  background:#020617;
  color:#e5e7eb;
}

/* LEFT SIDE */
.left{
  width:50%;
  background:linear-gradient(120deg,#020617,#020617,#000);
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:80px;
}

.left h1{
  font-size:48px;
  color:#22c55e;
}

.left p{
  margin-top:15px;
  color:#94a3b8;
  max-width:420px;
}

.features{
  margin-top:30px;
}

.features div{
  margin-bottom:10px;
  color:#94a3b8;
}

/* RIGHT SIDE */
.right{
  width:50%;
  display:flex;
  justify-content:center;
  align-items:center;
}

.login-card{
  width:380px;
  padding:40px;
  border-radius:16px;
  background:rgba(15,23,42,0.6);
  backdrop-filter: blur(10px);
  border:1px solid #1e293b;
  box-shadow:0 0 40px rgba(0,0,0,0.6);
}

.login-card h2{
  text-align:center;
  color:#22c55e;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border-radius:8px;
  border:1px solid #1e293b;
  background:#020617;
  color:#e5e7eb;
}

input:focus{
  outline:none;
  border-color:#22c55e;
}

button{
  width:100%;
  padding:12px;
  background:linear-gradient(90deg,#22c55e,#16a34a);
  border:none;
  border-radius:8px;
  color:#020617;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  box-shadow:0 0 15px rgba(34,197,94,0.6);
}

.extra{
  text-align:center;
  margin-top:15px;
  font-size:14px;
}

.extra a{
  color:#22c55e;
  text-decoration:none;
}
</style>
</head>

<body>

<!-- LEFT SIDE -->
<div class="left">
  <h1>HackProof</h1>
  <p>Cybersecurity learning platform with labs, CTF challenges and certifications.</p>

  <div class="features">
    <div>✔ Hands-on Labs</div>
    <div>✔ Capture The Flag</div>
    <div>✔ Learning Roadmaps</div>
    <div>✔ Certificates</div>
  </div>
</div>

<!-- RIGHT SIDE LOGIN -->
<div class="right">
  <div class="login-card">
    <h2>Login</h2>

    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <div class="extra">
      Don't have an account? <a href="register.html">Create Account</a>
    </div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, password)
    .then(()=>{
      window.location.href = "dashboard.html";
    })
    .catch((error)=>{
      alert(error.message);
    });
});

auth.onAuthStateChanged(user=>{
  if(user){
    window.location.href = "dashboard.html";
  }
});
</script>

</body>
</html>

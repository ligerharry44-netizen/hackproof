<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | HackProof Notes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020617;
      overflow: hidden;
      color: #e5e7eb;
    }

    /* Animated background */
    body::before {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, #22c55e33, transparent 70%);
      top: -100px;
      left: -100px;
      animation: move1 10s infinite alternate;
    }

    body::after {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, #16a34a33, transparent 70%);
      bottom: -100px;
      right: -100px;
      animation: move2 12s infinite alternate;
    }

    @keyframes move1 {
      from { transform: translate(0,0); }
      to { transform: translate(100px, 80px); }
    }

    @keyframes move2 {
      from { transform: translate(0,0); }
      to { transform: translate(-120px, -90px); }
    }

    .login-card {
      position: relative;
      width: 380px;
      padding: 40px;
      border-radius: 16px;
      background: rgba(2, 6, 23, 0.85);
      border: 1px solid #1e293b;
      backdrop-filter: blur(15px);
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
      z-index: 1;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo img {
      width: 55px;
      margin-bottom: 10px;
    }

    .logo h1 {
      color: #22c55e;
      font-size: 1.5rem;
    }

    .logo p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 5px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      font-size: 0.8rem;
      color: #94a3b8;
      display: block;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      background: #020617;
      color: #e5e7eb;
      font-size: 0.9rem;
    }

    input:focus {
      outline: none;
      border-color: #22c55e;
      box-shadow: 0 0 0 1px #22c55e;
    }

    .forgot {
      text-align: right;
      font-size: 0.8rem;
      margin-bottom: 15px;
    }

    .forgot a {
      color: #22c55e;
      text-decoration: none;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      border: none;
      border-radius: 8px;
      color: #020617;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 15px rgba(34,197,94,0.3);
    }

    .extra {
      text-align: center;
      margin-top: 18px;
      font-size: 0.85rem;
    }

    .extra a {
      color: #22c55e;
      text-decoration: none;
    }

    footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.7rem;
      color: #64748b;
    }

  </style>
</head>

<body>

  <div class="login-card">
    <div class="logo">
      <img src="favicon.svg">
      <h1>HackProof Notes</h1>
      <p>Cybersecurity Learning Platform</p>
    </div>

    <form onsubmit="loginUser(event)">
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="email" required>
      </div>

      <div class="input-group">
        <label>Password</label>
       <input type="password" id="password" required>
      </div>

      <div class="forgot">
        <a href="forgot-password.html">Forgot Password?</a>
      </div>

      <button type="submit" class="login-btn">Login</button>
    </form>

    <div class="extra">
      <a href="register.html">Create account</a>
    </div>

    <footer>
      Ethical cybersecurity learning only
    </footer>
  </div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
function loginUser(event){
  event.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, password)
    .then(() => {
      window.location.href = "dashboard.html";
    })
    .catch((error) => {
      alert(error.message);
    });
}
</script>
</body>
</html>

<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cyber News | HackProof</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#020617;
  --card:#0f172a;
  --border:#1e293b;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --green:#22c55e;
}

body{
  margin:0;
  font-family:Inter;
  background: radial-gradient(circle at top, #020617, #000);
  color:var(--text);
}

/* NAVBAR */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 40px;
  border-bottom:1px solid var(--border);
}

.logo{
  color:var(--green);
  font-weight:700;
  font-size:20px;
}

/* HEADER */
.header{
  padding:40px;
}

.header h1{
  font-size:28px;
}

.header p{
  color:var(--muted);
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  padding:0 40px;
}

.stat-card{
  background:var(--card);
  padding:20px;
  border-radius:12px;
  text-align:center;
}

.stat-number{
  color:var(--green);
  font-size:26px;
}

/* SEARCH */
.search-box{
  width:calc(100% - 80px);
  margin:20px 40px;
  padding:12px;
  border-radius:8px;
  border:1px solid var(--border);
  background:#000;
  color:white;
}

/* NEWS */
.container{
  padding:20px 40px;
}

.card{
  background:var(--card);
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
  border:1px solid var(--border);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:var(--green);
}

.card a{
  color:var(--green);
  text-decoration:none;
}

.date{
  font-size:12px;
  color:var(--muted);
}
</style>

</head>

<body>

<!-- NAV -->

<div class="navbar">
  <div class="logo">HackProof</div>
</div>

<!-- HEADER -->

<div class="header">
  <h1>Cyber Intelligence Feed</h1>
  <p>Stay updated with latest cybersecurity threats, attacks and vulnerabilities.</p>
</div>

<!-- STATS -->

<div class="stats">
  <div class="stat-card">
    <div class="stat-number" id="attacks"></div>
    Attacks Today
  </div>
  <div class="stat-card">
    <div class="stat-number" id="breaches"></div>
    Breaches
  </div>
  <div class="stat-card">
    <div class="stat-number" id="malware"></div>
    Malware
  </div>
</div>

<!-- SEARCH -->

<input type="text" id="search" class="search-box" placeholder="Search cyber news...">

<!-- NEWS -->

<div class="container" id="news"></div>

<script>

/* STATS */
document.getElementById("attacks").innerText = Math.floor(Math.random()*5000+2000);
document.getElementById("breaches").innerText = Math.floor(Math.random()*200+50);
document.getElementById("malware").innerText = Math.floor(Math.random()*1000+300);

/* NEWS LOAD */
let allNews = [];

fetch("https://api.rss2json.com/v1/api.json?rss_url=https://thehackernews.com/feeds/posts/default")
.then(res => res.json())
.then(data=>{
  allNews = data.items;
  displayNews(allNews);
});

function displayNews(newsItems){
  const newsDiv = document.getElementById("news");
  newsDiv.innerHTML="";

  newsItems.slice(0,10).forEach(item=>{
    newsDiv.innerHTML += `
      <div class="card">
        <a href="${item.link}" target="_blank">${item.title}</a>
        <div class="date">${item.pubDate}</div>
      </div>
    `;
  });
}

/* SEARCH FIXED */
document.getElementById("search").addEventListener("keyup", function(){
  const keyword = this.value.toLowerCase();

  const filtered = allNews.filter(item =>
    item.title.toLowerCase().includes(keyword)
  );

  displayNews(filtered);
});

</script>

</body>
</html>

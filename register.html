<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create Account | HackProof</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  height:100vh;
  display:flex;
  background:#020617;
  color:#e5e7eb;
  overflow:hidden;
}

/* Animated Background */
body::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:radial-gradient(circle at 20% 20%, rgba(34,197,94,0.15), transparent 40%),
             radial-gradient(circle at 80% 70%, rgba(56,189,248,0.15), transparent 40%);
  z-index:-1;
}

/* LEFT SIDE */
.left{
  width:50%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:80px;
}

.left h1{
  font-size:52px;
  color:#22c55e;
  text-shadow:0 0 15px rgba(34,197,94,0.5);
}

.left p{
  margin-top:15px;
  color:#94a3b8;
  max-width:420px;
}

.features{
  margin-top:30px;
}

.features div{
  margin-bottom:10px;
  color:#94a3b8;
}

/* RIGHT SIDE */
.right{
  width:50%;
  display:flex;
  justify-content:center;
  align-items:center;
}

.register-card{
  width:400px;
  padding:40px;
  border-radius:16px;
  background:rgba(15,23,42,0.6);
  backdrop-filter: blur(15px);
  border:1px solid #1e293b;
  box-shadow:0 0 60px rgba(0,0,0,0.7);
  animation: float 4s ease-in-out infinite;
}

@keyframes float{
  0%{ transform: translateY(0px);}
  50%{ transform: translateY(-8px);}
  100%{ transform: translateY(0px);}
}

.register-card h2{
  text-align:center;
  color:#22c55e;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border-radius:8px;
  border:1px solid #1e293b;
  background:#020617;
  color:#e5e7eb;
  transition:0.3s;
}

input:focus{
  outline:none;
  border-color:#22c55e;
  box-shadow:0 0 10px rgba(34,197,94,0.4);
}

button{
  width:100%;
  padding:12px;
  background:linear-gradient(90deg,#22c55e,#16a34a);
  border:none;
  border-radius:8px;
  color:#020617;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  box-shadow:0 0 20px rgba(34,197,94,0.6);
}

.extra{
  text-align:center;
  margin-top:15px;
  font-size:14px;
}

.extra a{
  color:#22c55e;
  text-decoration:none;
}
</style>
</head>

<body>

<!-- LEFT SIDE -->
<div class="left">
  <h1>Join HackProof</h1>
  <p>Start your cybersecurity journey with labs, CTF challenges, learning paths and certifications.</p>

  <div class="features">
    <div>✔ Cybersecurity Roadmaps</div>
    <div>✔ Hands-on Labs</div>
    <div>✔ Capture The Flag</div>
    <div>✔ Certificates</div>
  </div>
</div>

<!-- RIGHT SIDE REGISTER -->
<div class="right">
  <div class="register-card">
    <h2>Create Account</h2>

    <form id="registerForm">
      <input type="text" id="username" placeholder="Username" required>
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Create Account</button>
    </form>

    <div class="extra">
      Already have account? <a href="login.html">Login</a>
    </div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
document.getElementById("registerForm").addEventListener("submit", function(e){
  e.preventDefault();

  const username = document.getElementById("username").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(email, password)
    .then((userCredential) => {

      const user = userCredential.user;

      return db.collection("users").doc(user.uid).set({
        username: username,
        email: email,
        coursesCompleted: 0,
        certificates: 0,
        labsCompleted: 0,
        progress:{
          cybersecurity:0,
          networking:0,
          os:0
        }
      });

    })
    .then(()=>{
      alert("Account created successfully");
      window.location.href = "login.html";
    })
    .catch((error)=>{
      alert(error.message);
    });
});
</script>

</body>
</html>

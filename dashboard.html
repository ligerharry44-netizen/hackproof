<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{
  margin:0;
  font-family:Inter;
  background: radial-gradient(circle at top, #020617, #000);
  color:#e5e7eb;
}

/* Top Navigation */
.topnav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 40px;
  border-bottom:1px solid #1e293b;
  background:rgba(2,6,23,0.7);
  backdrop-filter:blur(10px);
}

.logo{
  color:#22c55e;
  font-weight:700;
  font-size:20px;
}

.nav-links a{
  margin:0 15px;
  text-decoration:none;
  color:#94a3b8;
}

.nav-links a:hover{
  color:white;
}

.user-box{
  border:1px solid #22c55e;
  padding:6px 14px;
  border-radius:8px;
}

/* Container */
.container{
  max-width:1100px;
  margin:auto;
  padding:40px 20px;
}

/* Cards */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:25px;
  margin-bottom:40px;
}

.card{
  background:rgba(15,23,42,0.6);
  padding:25px;
  border-radius:14px;
  border:1px solid #1e293b;
  text-align:center;
}

.card h1{
  color:#22c55e;
}

/* Progress Diagram */
.progress-diagram{
  display:flex;
  justify-content:space-around;
  margin-bottom:40px;
}

.progress-card{
  text-align:center;
}

.circle{
  width:120px;
  height:120px;
  border-radius:50%;
  border:10px solid #22c55e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  margin-top:10px;
}

/* Badges */
.badges{
  text-align:center;
}

.badge{
  display:inline-block;
  padding:8px 14px;
  border:1px solid #22c55e;
  border-radius:20px;
  margin:5px;
}
</style>
</head>

<body>

<div class="dashboard">


<div class="topnav">
  <div class="logo">HackProof</div>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="settings.html">Settings</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>

  <div class="user-box">👤 <b id="username">User</b></div>
</div>


<div class="container">

  <!-- Stats -->
  <div class="cards">
    <div class="card">
      <h3>Points</h3>
      <h1 id="points">0</h1>
    </div>

    <div class="card">
      <h3>Rank</h3>
      <h1 id="rank">0</h1>
    </div>

    <div class="card">
      <h3>Courses</h3>
      <h1 id="courses">0</h1>
    </div>

    <div class="card">
      <h3>Labs</h3>
      <h1 id="labs">0</h1>
    </div>
  </div>

  <!-- Progress Diagram -->
  <div class="progress-diagram">
    <div class="progress-card">
      <h4>Cyber Security</h4>
      <div class="circle" id="cyberCircle">0%</div>
    </div>

    <div class="progress-card">
      <h4>Networking</h4>
      <div class="circle" id="netCircle">0%</div>
    </div>

    <div class="progress-card">
      <h4>Operating Systems</h4>
      <div class="circle" id="osCircle">0%</div>
    </div>
  </div>

  <!-- Badges -->
  <div class="badges" id="badges"></div>

</div>
</div>
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
auth.onAuthStateChanged(async (user)=>{
  if(!user){
    window.location.href = "login.html";
  }else{
    const doc = await db.collection("users").doc(user.uid).get();
    const data = doc.data();

    document.getElementById("username").innerText = data.username;
    document.getElementById("points").innerText = data.points;
    document.getElementById("rank").innerText = "#" + data.rank;
    document.getElementById("courses").innerText = data.coursesCompleted;
    document.getElementById("labs").innerText = data.labsCompleted;

    document.getElementById("cyberProgress").style.width = data.progress.cybersecurity + "%";
    document.getElementById("netProgress").style.width = data.progress.networking + "%";
    document.getElementById("osProgress").style.width = data.progress.os + "%";

    // Badges
    const badgesDiv = document.getElementById("badges");
    for(const badge in data.badges){
      if(data.badges[badge]){
        badgesDiv.innerHTML += `<span class="badge">${badge}</span>`;
      }
    }
  }
});

function logout(){
  auth.signOut();
  window.location.href = "login.html";
}

function toggleTheme(){
  document.body.classList.toggle("light");
}
</script>

</body>
</html>
